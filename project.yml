name: CautionFlag
options:
  bundleIdPrefix: com.tbird
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  CooldownCore:
    path: Packages/CooldownCore
  # In-app updates. The feed (appcast.xml) lives on the public tap repo, next to
  # the release zips; scripts/release.sh signs each zip and adds its entry.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"
targets:
  CautionFlag:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      # Icon Composer package; Xcode compiles it into Assets.car (Liquid Glass).
      - path: assets/icon/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: CooldownCore
        product: CooldownCore
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Caution Flag
        CFBundleDisplayName: Caution Flag
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: https://raw.githubusercontent.com/taylorbird/homebrew-caution-flag/main/appcast.xml
        # EdDSA public key; the private half is in the login Keychain (Sparkle generate_keys).
        SUPublicEDKey: jhlvwQpvD+frkGmqb05Fki4BcFydq5C4qUfjRtpquiw=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tbird.cautionflag
        PRODUCT_NAME: Caution Flag
        MARKETING_VERSION: "0.1.4"
        # scripts/build.sh overrides this with the git commit count.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # One stable Developer ID identity for every build, so the Accessibility
        # grant survives rebuilds and releases can be notarized.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: UFCDGSKCXB
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # Notarization requires the hardened runtime. AX reading and posting
        # keystrokes need no runtime exceptions.
        ENABLE_HARDENED_RUNTIME: YES
        # Accessibility APIs that read other apps are unavailable in the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  CautionFlag:
    build:
      targets:
        CautionFlag: all
    run:
      config: Debug
